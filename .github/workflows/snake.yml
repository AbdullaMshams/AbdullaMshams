name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: AbdullaMshams
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F2B400&color_dots=#EFF6FF,#BFDBFE,#60A5FA,#2563EB,#1E3A8A
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F2B400&color_dots=#0D1117,#0C2D6B,#1158C7,#316DCA,#58A6FF

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
